<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NexTerm</title>
  <meta name="description" content="NexTerm: a USB serial terminal for Android. Documentation coming soon.">
  <style>
    :root { --bg: #0D1117; --fg: #E6EDF3; --mu: #8B949E; --green: #10B981; --line: #30363D; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5; }
    main { max-width: 520px; }
    h1 { margin: 0 0 4px; font-size: 32px; font-weight: 600; }
    h1 span { color: var(--green); }
    p { margin: 12px 0; color: var(--mu); }
    .soon { display: inline-block; margin-top: 8px; padding: 2px 10px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; color: var(--fg); }
    a { color: var(--green); }
  </style>
</head>
<body>
  <main>
    <h1>Nex<span>Term</span></h1>
    <p>A USB serial terminal for Android.</p>
    <span class="soon">Documentation coming soon</span>
    <p>In the meantime, the source and the README are on <a href="https://github.com/shad0w82/NexTerm">GitHub</a>.</p>
  </main>
</body>
</html>
